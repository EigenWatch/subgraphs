services:
  rpc-proxy:
    build: ./rpc-proxy
    environment:
      RPC_GATEWAY_URL: ${RPC_GATEWAY_URL:-https://gateway.thebuidl.xyz/query}
      RPC_API_KEY: ${RPC_API_KEY}
      ALCHEMY_RPC_URL: ${ALCHEMY_RPC_URL:-}
      ALCHEMY_RPC_URL_2: ${ALCHEMY_RPC_URL_2:-}
      INFURA_RPC_URL: ${INFURA_RPC_URL:-}
      BACKFILL_THRESHOLD: ${BACKFILL_THRESHOLD:-1000}
      PORT: 3000
  graph-node:
    image: graphprotocol/graph-node
    # No public ports - nginx handles external access
    expose:
      - "8000"
      - "8001"
      - "8020"
      - "8030"
      - "8040"
    depends_on:
      - ipfs
      - rpc-proxy
      - postgres

    environment:
      postgres_host: ${POSTGRES_HOST}
      postgres_port: ${POSTGRES_PORT:-5432}
      postgres_user: ${POSTGRES_USER}
      postgres_pass: ${POSTGRES_PASSWORD}
      postgres_db: ${POSTGRES_DB}
      ipfs: "ipfs:5001"
      ethereum: "mainnet:http://rpc-proxy:3000"
      GRAPH_LOG: info
      # Query limits (defaults: 1000/5000)
      GRAPH_GRAPHQL_MAX_FIRST: 5000
      GRAPH_GRAPHQL_MAX_SKIP: 10000
  ipfs:
    image: ipfs/kubo:v0.17.0
    ports:
      - "127.0.0.1:7005:5001"
    volumes:
      - ./data/ipfs:/data/ipfs
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - ./data/postgres-c:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:7006:5432"

  nginx:
    build: ./nginx
    ports:
      - "7000:80"
    depends_on:
      - graph-node
      - prometheus
      - rpc-proxy
    environment:
      GRAPHQL_API_KEY: ${GRAPHQL_API_KEY}
    restart: unless-stopped
  prometheus:
    build: ./monitoring/prometheus
    # No public ports - access via nginx at /prometheus/ with API key
    expose:
      - "9090"
    volumes:
      - prometheus_data:/prometheus
    depends_on:
      - rpc-proxy
      - graph-node
      - cadvisor

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.2
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki:/etc/loki
    command: -config.file=/etc/loki/loki-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.2
    volumes:
      - ./monitoring/promtail:/etc/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  prometheus_data:
