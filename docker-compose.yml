services:
  rpc-proxy:
    build: ./rpc-proxy
    environment:
      RPC_GATEWAY_URL: ${RPC_GATEWAY_URL:-https://gateway.thebuidl.xyz/query}
      RPC_API_KEY: ${RPC_API_KEY}
      ALCHEMY_RPC_URL: ${ALCHEMY_RPC_URL:-}
      INFURA_RPC_URL: ${INFURA_RPC_URL:-}
      PORT: 3000
  graph-node:
    image: graphprotocol/graph-node
    # No public ports - nginx handles external access
    expose:
      - "8000"
      - "8001"
      - "8020"
      - "8030"
      - "8040"
    depends_on:
      - ipfs
      - rpc-proxy
      - postgres

    environment:
      postgres_host: ${POSTGRES_HOST}
      postgres_port: ${POSTGRES_PORT:-5432}
      postgres_user: ${POSTGRES_USER}
      postgres_pass: ${POSTGRES_PASSWORD}
      postgres_db: ${POSTGRES_DB}
      ipfs: "ipfs:5001"
      ethereum: "mainnet:http://rpc-proxy:3000"
      GRAPH_LOG: info
      # Query limits (defaults: 1000/5000)
      GRAPH_GRAPHQL_MAX_FIRST: 5000
      GRAPH_GRAPHQL_MAX_SKIP: 10000
  ipfs:
    image: ipfs/kubo:v0.17.0
    ports:
      - "127.0.0.1:7005:5001"
    volumes:
      - ./data/ipfs:/data/ipfs
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - ./data/postgres-c:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:7006:5432"
  deployer:
    build: ./deployer
    depends_on:
      - graph-node
      - ipfs
    volumes:
      - .:/subgraph:ro
    environment:
      SUBGRAPH_NAME: eigenwatch-ethereum
    restart: "no"
  nginx:
    build: ./nginx
    ports:
      - "7000:80"
    depends_on:
      - graph-node
      - prometheus
      - rpc-proxy
    environment:
      GRAPHQL_API_KEY: ${GRAPHQL_API_KEY}
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.45.0
    # No public ports - access via nginx at /prometheus/ with API key
    expose:
      - "9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - rpc-proxy
      - graph-node

volumes:
  prometheus_data:
