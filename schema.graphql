# ========================================
# EIGENWATCH EVENT-FOCUSED SUBGRAPH SCHEMA
# Focus: Pure event capture with minimal entity state
# ========================================

# ========================================
# BASE EVENT INTERFACE
# ========================================

interface BaseEvent {
  id: ID!
  transactionHash: Bytes!
  logIndex: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  contractAddress: Bytes!
}

# ========================================
# MINIMAL LOOKUP ENTITIES
# (Only for GraphQL relationships - no complex state)
# ========================================

type Operator @entity(immutable: false) {
  id: ID! # operator address
  address: Bytes!

  # Relationships to events only
  registrationEvents: [OperatorRegistered!]! @derivedFrom(field: "operator")
  shares: [OperatorStrategyShare!]! @derivedFrom(field: "operator")
  shareEvents: [OperatorShareEvent!]! @derivedFrom(field: "operator")
  slashingEvents: [OperatorSlashed!]! @derivedFrom(field: "operator")
  avsRegistrationEvents: [OperatorAVSRegistrationStatusUpdated!]!
    @derivedFrom(field: "operator")
  operatorSetJoinEvents: [OperatorAddedToOperatorSet!]!
    @derivedFrom(field: "operator")
  operatorSetLeaveEvents: [OperatorRemovedFromOperatorSet!]!
    @derivedFrom(field: "operator")
  allocationEvents: [AllocationEvent!]! @derivedFrom(field: "operator")
  metadataUpdateEvents: [OperatorMetadataUpdate!]!
    @derivedFrom(field: "operator")
  delegationApproverUpdates: [DelegationApproverUpdated!]!
    @derivedFrom(field: "operator")
  keyRegistrationEvents: [KeyRegistrationEvent!]!
    @derivedFrom(field: "operator")
}

type Staker @entity(immutable: false) {
  id: ID! # staker address
  address: Bytes!

  # Relationships to events only
  delegationEvents: [StakerDelegationEvent!]! @derivedFrom(field: "staker")
  shareEvents: [OperatorShareEvent!]! @derivedFrom(field: "staker")
  depositEvents: [Deposit!]! @derivedFrom(field: "staker")
  withdrawalEvents: [WithdrawalEvent!]! @derivedFrom(field: "staker")
  podDeploymentEvents: [PodDeployed!]! @derivedFrom(field: "owner")
  beaconChainDepositEvents: [BeaconChainDeposit!]!
    @derivedFrom(field: "podOwner")
  beaconChainWithdrawalEvents: [BeaconChainWithdrawal!]!
    @derivedFrom(field: "podOwner")
  podSharesUpdateEvents: [PodSharesUpdate!]! @derivedFrom(field: "podOwner")
  beaconChainSlashingEvents: [BeaconChainSlashingEvent!]!
    @derivedFrom(field: "staker")
  forceUndelegationEvents: [StakerForceUndelegated!]!
    @derivedFrom(field: "staker")
  depositScalingEvents: [DepositScalingFactorUpdated!]!
    @derivedFrom(field: "staker")
}

type AVS @entity(immutable: false) {
  id: ID! # avs address
  address: Bytes!

  # Relationships to events only
  operatorRegistrationEvents: [OperatorAVSRegistrationStatusUpdated!]!
    @derivedFrom(field: "avs")
  rewardsSubmissionEvents: [RewardsSubmission!]! @derivedFrom(field: "avs")
  operatorDirectedRewardsEvents: [OperatorDirectedAVSRewardsSubmission!]!
    @derivedFrom(field: "avs")
  metadataUpdateEvents: [AVSMetadataUpdate!]! @derivedFrom(field: "avs")
  operatorSetCreationEvents: [OperatorSetCreated!]! @derivedFrom(field: "avs")
  registrarSetEvents: [AVSRegistrarSet!]! @derivedFrom(field: "avs")
  taskCreatedEvents: [TaskCreated!]! @derivedFrom(field: "avs")
  executorOperatorSetRegistrationEvents: [ExecutorOperatorSetRegistered!]!
    @derivedFrom(field: "avs")
}

type Strategy @entity(immutable: false) {
  id: ID! # strategy contract address
  address: Bytes!
  underlyingToken: Bytes
  tokenDecimals: Int

  # Relationships to events only
  depositEvents: [Deposit!]! @derivedFrom(field: "strategy")
  operatorShares: [OperatorStrategyShare!]! @derivedFrom(field: "strategy")
  shareEvents: [OperatorShareEvent!]! @derivedFrom(field: "strategy")
  allocationEvents: [AllocationEvent!]! @derivedFrom(field: "strategy")
  whitelistEvents: [StrategyWhitelistEvent!]! @derivedFrom(field: "strategy")
  strategyOperatorSetEvents: [StrategyOperatorSetEvent!]!
    @derivedFrom(field: "strategy")
  # Note: slashingEvents removed - strategies field is [String!] array, not Strategy entities
}

type OperatorSet @entity(immutable: false) {
  id: ID! # avs-operatorSetId composite
  avs: AVS!
  operatorSetId: BigInt!

  # Relationships to events only
  creationEvent: [OperatorSetCreated!]! @derivedFrom(field: "operatorSet")
  memberJoinEvents: [OperatorAddedToOperatorSet!]!
    @derivedFrom(field: "operatorSet")
  memberLeaveEvents: [OperatorRemovedFromOperatorSet!]!
    @derivedFrom(field: "operatorSet")
  allocationEvents: [AllocationEvent!]! @derivedFrom(field: "operatorSet")
  slashingEvents: [OperatorSlashed!]! @derivedFrom(field: "operatorSet")
  strategyEvents: [StrategyOperatorSetEvent!]!
    @derivedFrom(field: "operatorSet")
  redistributionEvents: [RedistributionAddressSet!]!
    @derivedFrom(field: "operatorSet")
  operatorDirectedRewardsEvents: [OperatorDirectedOperatorSetRewardsSubmission!]!
    @derivedFrom(field: "operatorSet")
  slasherUpdatedEvents: [SlasherUpdated!]! @derivedFrom(field: "operatorSet")
  slasherMigratedEvents: [SlasherMigrated!]! @derivedFrom(field: "operatorSet")
  metadataPublishedEvents: [OperatorSetMetadataPublished!]!
    @derivedFrom(field: "operatorSet")
  releasePublishedEvents: [ReleasePublished!]! @derivedFrom(field: "operatorSet")
  keyConfig: [OperatorSetKeyConfig!]! @derivedFrom(field: "operatorSet")
  keyRegistrationEvents: [KeyRegistrationEvent!]!
    @derivedFrom(field: "operatorSet")
}

type OperatorStrategyShare @entity(immutable: false) {
  id: ID! # operator-strategy
  operator: Operator!
  strategy: Strategy!
  totalShares: BigInt!

  # Metadata
  lastUpdatedBlock: BigInt!
  lastUpdatedTimestamp: BigInt!
  lastUpdatedTxHash: Bytes!
}

type EigenPod @entity(immutable: false) {
  id: ID! # pod address
  address: Bytes!
  owner: Staker!

  # Relationships to events only
  deploymentEvent: [PodDeployed!]! @derivedFrom(field: "pod")
  beaconChainDepositEvents: [BeaconChainDeposit!]! @derivedFrom(field: "pod")
  shareUpdateEvents: [PodSharesUpdate!]! @derivedFrom(field: "pod")
  beaconChainWithdrawalEvents: [BeaconChainWithdrawal!]!
    @derivedFrom(field: "pod")
}

