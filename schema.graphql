# RELEASE MANAGER EVENTS

type OperatorSetMetadataPublished implements BaseEvent @entity(immutable: true) {
  id: ID! # txHash-logIndex
  transactionHash: Bytes!
  logIndex: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  contractAddress: Bytes!

  # Event data
  operatorSet: OperatorSet!
  metadataURI: String!
}

type ReleasePublished implements BaseEvent @entity(immutable: true) {
  id: ID! # txHash-logIndex
  transactionHash: Bytes!
  logIndex: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  contractAddress: Bytes!

  # Event data
  operatorSet: OperatorSet!
  releaseId: BigInt!
  upgradeByTime: BigInt! # Unix timestamp; 0 means instant upgrade required
  artifacts: [ReleaseArtifact!]! @derivedFrom(field: "release")
}

type ReleaseArtifact @entity(immutable: true) {
  id: ID! # releasePublished.id + "-" + artifactIndex
  release: ReleasePublished!
  artifactIndex: Int!
  digest: Bytes! # content hash for integrity verification
  registry: String! # where to pull (Docker Hub, IPFS, OCI)
}

